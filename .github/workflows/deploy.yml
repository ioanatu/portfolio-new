name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; never cancel one that is mid-upload
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for AWS OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test:run
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Hashed assets are immutable, so cache them for a year
      - name: Sync assets
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
      # index.html must always be revalidated
      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache"
      - name: Invalidate CloudFront
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html"
