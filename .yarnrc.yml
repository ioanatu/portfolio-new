compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

# The component library lives on GitHub Packages. The token is read from the environment (see the
# README), so that it is never stored in this repo
npmMinimalAgeGate: 0

npmPreapprovedPackages:
  - '@ioanatu/component-library'

npmScopes:
  ioanatu:
    npmRegistryServer: 'https://npm.pkg.github.com'
    npmAuthToken: '${GITHUB_PACKAGES_TOKEN:-}'
